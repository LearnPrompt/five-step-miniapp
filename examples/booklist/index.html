<!doctype html><html lang="zh"><meta charset="utf-8"><title>每日书单</title><body><h1>每日书单</h1><select id="category"><option>全部</option><option>小说</option><option>技术</option></select><main id="books"></main><script>let books=[];fetch('books.json').then(r=>r.json()).then(a=>{books=a;render()});function render(){document.getElementById('books').innerHTML=books.filter(b=>category.value==='全部'||b.category===category.value).map(b=>'<article><h2>'+b.title+'</h2><p>'+b.category+'</p><button data-id="'+b.id+'">看详情</button></article>').join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>alert(books.find(x=>x.id===b.dataset.id).description))};category.onchange=render;</script></body></html>
